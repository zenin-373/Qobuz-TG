name: Deploy to Heroku

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Heroku app name (optional; defaults to HEROKU_APP_NAME secret)"
        required: false
        default: ""
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_EMAIL: ${{ secrets.HEROKU_EMAIL }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          missing=0
          if [ -z "$HEROKU_API_KEY" ]; then echo "❌ Missing secret: HEROKU_API_KEY"; missing=1; fi
          if [ -z "$HEROKU_EMAIL" ]; then echo "❌ Missing secret: HEROKU_EMAIL"; missing=1; fi
          if [ -z "$HEROKU_APP_NAME" ] && [ -z "${{ github.event.inputs.app_name }}" ]; then
            echo "❌ Missing secret: HEROKU_APP_NAME (or workflow input app_name)"
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo ""
            echo "Add these under: Repo → Settings → Secrets and variables → Actions"
            echo "  HEROKU_API_KEY   = Heroku Account Settings → API Key"
            echo "  HEROKU_EMAIL     = your Heroku login email"
            echo "  HEROKU_APP_NAME  = your heroku app name"
            exit 1
          fi
          echo "✓ Secrets present"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          heroku version

      - name: Set app name
        id: app
        run: |
          NAME="${{ github.event.inputs.app_name }}"
          if [ -z "$NAME" ]; then NAME="${{ secrets.HEROKU_APP_NAME }}"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Deploying to app: $NAME"

      - name: Heroku login (.netrc)
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_EMAIL: ${{ secrets.HEROKU_EMAIL }}
        run: |
          cat > ~/.netrc << EOF
machine api.heroku.com
  login ${HEROKU_EMAIL}
  password ${HEROKU_API_KEY}
machine git.heroku.com
  login ${HEROKU_EMAIL}
  password ${HEROKU_API_KEY}
EOF
          chmod 600 ~/.netrc
          heroku auth:whoami

      - name: Ensure app exists
        run: |
          APP="${{ steps.app.outputs.name }}"
          if heroku apps:info -a "$APP" >/dev/null 2>&1; then
            echo "App $APP exists"
          else
            echo "Creating app $APP…"
            heroku create "$APP"
          fi

      - name: Python buildpack
        run: |
          APP="${{ steps.app.outputs.name }}"
          heroku buildpacks:set heroku/python -a "$APP" || true

      - name: Deploy (git push)
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          APP="${{ steps.app.outputs.name }}"
          # Use authenticated remote URL (more reliable than heroku git:remote alone)
          git remote remove heroku 2>/dev/null || true
          git remote add heroku "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${APP}.git"
          git push heroku HEAD:refs/heads/main --force

      - name: Scale worker only
        run: |
          APP="${{ steps.app.outputs.name }}"
          heroku ps:scale worker=1 web=0 -a "$APP" || heroku ps:scale worker=1 -a "$APP"
          heroku ps -a "$APP"
