name: Deploy to Heroku

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_name:
        description: "Heroku app name (optional override)"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh
          heroku version

      - name: Install GitHub CLI
        run: |
          (type -p wget >/dev/null || (sudo apt update && sudo apt-get install wget -y)) \
            && sudo mkdir -p -m 755 /etc/apt/keyrings \
            && out=$(mktemp) && wget -nv -O$out https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            && cat $out | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
            && sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \
            && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
            && sudo apt update \
            && sudo apt install gh -y
          gh --version

      - name: Set app name
        id: app
        run: |
          NAME="${{ github.event.inputs.app_name }}"
          if [ -z "$NAME" ]; then
            NAME="${{ secrets.HEROKU_APP_NAME }}"
          fi
          if [ -z "$NAME" ]; then
            echo "HEROKU_APP_NAME secret (or workflow input) is required"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Login to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo "$HEROKU_API_KEY" | heroku auth:token >/dev/null 2>&1 || true
          cat > ~/.netrc << EOF
machine api.heroku.com
  login ${{ secrets.HEROKU_EMAIL }}
  password ${{ secrets.HEROKU_API_KEY }}
machine git.heroku.com
  login ${{ secrets.HEROKU_EMAIL }}
  password ${{ secrets.HEROKU_API_KEY }}
EOF
          chmod 600 ~/.netrc
          heroku auth:whoami

      - name: Ensure Heroku app exists
        run: |
          if ! heroku apps:info -a "${{ steps.app.outputs.name }}" >/dev/null 2>&1; then
            heroku create "${{ steps.app.outputs.name }}"
          fi

      - name: Set buildpack & stack
        run: |
          heroku buildpacks:clear -a "${{ steps.app.outputs.name }}" || true
          heroku buildpacks:set heroku/python -a "${{ steps.app.outputs.name }}"
          heroku stack:set heroku-24 -a "${{ steps.app.outputs.name }}" || true

      - name: Add Heroku git remote
        run: |
          heroku git:remote -a "${{ steps.app.outputs.name }}"

      - name: Deploy to Heroku
        run: |
          git push heroku HEAD:main --force

      - name: Scale worker (no web dyno)
        run: |
          heroku ps:scale worker=1 web=0 -a "${{ steps.app.outputs.name }}" || \
          heroku ps:scale worker=1 -a "${{ steps.app.outputs.name }}"

      - name: Show dynos
        run: heroku ps -a "${{ steps.app.outputs.name }}"
